# Befehlssystem (alle über Core registrierten Befehle): Hilfeseiten, Fehler, gemeinsame Schlüsselwörter, /vhelp, /vadmin commands.
command:
  help:
    # Name des erzeugten Hilfe-Unterbefehls (/<befehl> hilfe); "help" und "?" gehen immer.
    name: hilfe
    aliases: []
    header: "<gold>── <yellow>{command}</yellow> ── <gray>Hilfe {page}/{pages}"
    description: "<gray>{description}"
    line: "<yellow>{usage}</yellow><dark_gray> – <gray>{description}"
    line-plain: "<yellow>{usage}"
    hover-run: "<gray>{description}\n<yellow>Klick: {command} ausführen"
    hover-suggest: "<gray>{description}\n<yellow>Klick: {command} eintippen"
    previous: "<yellow>[« vorige Seite]"
    next: "<yellow>[nächste Seite »]"
    empty: "<gray>Hier gibt es nichts, das du benutzen darfst."
  error:
    no-permission: "<red>Dafür hast du keine Berechtigung."
    player-only: "<red>Das können nur Spieler."
    unknown-sub: "<red>Unbekannter Unterbefehl: <white>{input}"
    did-you-mean: "<gray>Meintest du <yellow>{suggestion}</yellow>? <dark_gray>(Klick)"
    see-help: "<gray>Alle Befehle: <yellow>{command}"
    missing-arg: "<red>Es fehlt: <white>{arg}"
    too-many: "<red>Zu viele Angaben."
    usage: "<gray>Verwendung: <yellow>{usage}"
    not-a-number: "<red>{input} ist keine Zahl."
    number-range: "<red>{input} muss zwischen {min} und {max} liegen."
    player-not-found: "<red>Kein Spieler namens {input} ist online."
    world-not-found: "<red>Es gibt keine Welt namens {input}."
    bad-choice: "<red>{input} geht hier nicht. Möglich: <white>{choices}"
    cooldown: "<red>Bitte warte noch {seconds} s, bevor du das wieder benutzt."
    disabled: "<red>Dieser Befehl ist gerade nicht verfügbar."
    internal: "<red>Da ist etwas schiefgegangen. Der Fehler wurde für die Admins protokolliert."
  # Schlüsselwörter, die jeder Befehl versteht (Englisch geht immer). Ein Plugin kann eines für seinen Befehl mit
  # commands.<befehl>.values.<schlüssel> ersetzen. Bei einer Liste wird der erste Name angezeigt, alle werden verstanden.
  values:
    "on": [an, ein]
    "off": aus
    "true": wahr
    "false": falsch
    "yes": ja
    "no": nein
    clear: [löschen, loeschen]
    list: liste
    all: alle
  overview:
    header: "<gold>── <yellow>Befehle</yellow> ── <gray>Seite {page}/{pages}"
    plugin: "<aqua><bold>{plugin}"
    line: "<yellow>/{command}</yellow>{also}<dark_gray> – <gray>{description}"
    also: "<dark_gray> (/{aliases})"
    hover: "<gray>{description}\n<yellow>Klick: {action}"
    action-help: "Hilfe anzeigen"
    action-type: "Befehl eintippen"
    empty: "<gray>Es gibt keine Befehle, die du benutzen darfst."
    unknown-plugin: "<red>Kein Plugin mit Befehlen namens {plugin}."
    footer: "<dark_gray>Klicke auf einen Befehl. Nur ein Plugin: /vhilfe PLUGIN"
  admin:
    header: "<gold>── <yellow>Registrierte Befehle</yellow> ── <gray>{count} Bäume, Seite {page}/{pages}"
    mode: "<gray>Übersetzte Haupt-Aliase: <white>{mode}</white> <dark_gray>(Serversprache: {language})"
    mode-option: "<yellow>[{mode}]"
    mode-hover: "Klick: {mode} verwenden"
    line: "<aqua>{plugin}</aqua> <yellow>/{command}</yellow> <dark_gray>({mount})</dark_gray><gray>{fixed}"
    fixed: " · Aliase: {aliases}"
    label-conflict: "<red>  /{command} gehört schon {owner}; nur /{prefix}:{command} funktioniert."
    fixed-conflict: "<red>  Fester Alias /{alias} gehört schon {owner}; er führt jenen Befehl aus, nicht diesen."
    alias: "<gray>  {language}: <white>/{alias}</white> {state}"
    state-active: "<green>aktiv"
    state-off_by_policy: "<dark_gray>aus (Sprache nicht freigegeben)"
    state-disabled: "<red>abgeschaltet"
    state-collision: "<gold>übersprungen, gehört {owner}"
    state-pending: "<gray>wird nach dem Start angewendet"
    turn-off: "<red>[abschalten]"
    turn-on: "<green>[einschalten]"
    toggle-hover: "Klick: /vadmin commands alias {alias} {value}"
    conflict: "<gold>  Namenskonflikt {conflict}"
    other: "<gray>Noch nicht umgestellt (nur plugin.yml): <white>{commands}"
    mode-set: "<green>Übersetzte Haupt-Aliase: {mode}. Angewendet."
    alias-set: "<green>/{alias} ist jetzt {state}."
    alias-unknown: "<red>Kein übersetzter Alias /{alias}. Siehe /vadmin commands."
    usage: "<gray>/vadmin commands [SEITE] | mode all|default|none | alias ALIAS on|off"

# Core-eigene Befehle (Schlüssel-Konvention für jedes Plugin, siehe docs/API.md "Commands"): Beschreibung, übersetzte
# Haupt-Aliase, Namen der Unterbefehle und Argumente.
commands:
  screen:
    description: "Bildschirme: offenen Bildschirm schließen; Admins: Demo"
    sub:
      settings:
        name: "einstellungen"
        args:
          resolution: "BREITExHÖHE"
        description: "Anzeige-Einstellungen für Bildschirme: Seitenverhältnis, Sichtfeld, Größe"
      classic:
        name: "klassisch"
        args:
          state: "an|aus"
        description: "Klassische Bildschirme an/aus (für Shaderpacks)"
      close:
        name: "schließen"
        description: "Deinen offenen Bildschirm schließen"
      demo:
        name: "demo"
        args:
          mode: "MODUS"
          backdrop: "HINTERGRUND"
        description: "Bildschirm-Demo öffnen (pinned oder floating)"
  vpoll:
    description: "Serverumfragen"
    sub:
      start:
        name: "starten"
        args:
          seconds: "SEKUNDEN"
          question: "FRAGE | ANTWORT | ANTWORT"
        description: "Umfrage starten: Sekunden Frage | Antwort | Antwort"
      vote:
        name: "abstimmen"
        args:
          id: "UMFRAGE-ID"
          option: "ANTWORT"
        description: "Über die anklickbaren Antworten in /vpoll abstimmen"
      close:
        name: "beenden"
        description: "Umfrage beenden und Ergebnis veröffentlichen"
      cancel:
        name: "abbrechen"
        description: "Ohne Ergebnis abbrechen"
      results:
        name: "ergebnis"
        description: "Letzte abgeschlossene Umfrage anzeigen"
  vnet:
    description: "Serverübergreifendes Netzwerk (Proxy-Hub)"
    sub:
      status:
        name: "status"
        description: "Verbindung zum Proxy-Hub"
      servers:
        name: "servers"
        description: "Server im Netzwerk mit Spielerzahl"
      broadcast:
        name: "broadcast"
        args:
          message: "NACHRICHT"
        description: "Ankündigung auf allen Servern (MiniMessage)"
      pair:
        name: "pair"
        description: "Diesen Server mit dem Proxy koppeln"
        sub:
          accept:
            name: "accept"
            args:
              code: "CODE"
            description: "Kopplung mit dem Code aus beiden Konsolen bestätigen"
      unpair:
        name: "unpair"
        description: "Kopplungsschlüssel vergessen"
  vhelp:
    description: "Alle Befehle, die du benutzen darfst, nach Plugin"
    aliases: [vhilfe, befehle]
    args:
      filter: PLUGIN
      page: SEITE
  menu:
    description: "Öffnet das Vystorm-Hauptmenü"
  vadmin:
    description: "Vystorm-Admin-Dashboard"
  admin:
    description: "Vystorm-Admin-Dashboard"
  einstellungen:
    description: "Persönliche und Server-Einstellungen aller Vystorm-Plugins"
  web:
    description: "Weboberfläche: öffnet eine Seite oder schickt einen Einmal-Login-Link"
  vtrade:
    description: "Handelskanal: Nachricht an alle mit Empfangsrecht"
  nbt:
    description: "Setzt einen Core-Tag auf das Item in der Hand (Admin)"
