# 命令系统（所有通过 Core 注册的命令）：帮助页、错误提示、通用关键词、/vhelp、/vadmin commands。
command:
  help:
    # 自动生成的帮助子命令名称（/<命令> 帮助）；"help" 和 "?" 也始终可用。
    name: 帮助
    aliases: []
    header: "<gold>── <yellow>{command}</yellow> ── <gray>帮助 {page}/{pages}"
    description: "<gray>{description}"
    line: "<yellow>{usage}</yellow><dark_gray> – <gray>{description}"
    line-plain: "<yellow>{usage}"
    hover-run: "<gray>{description}\n<yellow>点击执行 {command}"
    hover-suggest: "<gray>{description}\n<yellow>点击输入 {command}"
    previous: "<yellow>[« 上一页]"
    next: "<yellow>[下一页 »]"
    empty: "<gray>这里没有你可以使用的内容。"
  error:
    no-permission: "<red>你没有权限执行此操作。"
    player-only: "<red>只有玩家才能执行此操作。"
    unknown-sub: "<red>未知的子命令：<white>{input}"
    did-you-mean: "<gray>你是想输入 <yellow>{suggestion}</yellow> 吗？<dark_gray>（点击）"
    see-help: "<gray>所有命令：<yellow>{command}"
    missing-arg: "<red>缺少：<white>{arg}"
    too-many: "<red>参数过多。"
    usage: "<gray>用法：<yellow>{usage}"
    not-a-number: "<red>{input} 不是数字。"
    number-range: "<red>{input} 必须在 {min} 到 {max} 之间。"
    player-not-found: "<red>名为 {input} 的玩家不在线。"
    world-not-found: "<red>没有名为 {input} 的世界。"
    bad-choice: "<red>此处不能使用 {input}。可选：<white>{choices}"
    cooldown: "<red>请等待 {seconds} 秒后再使用。"
    disabled: "<red>此命令当前不可用。"
    internal: "<red>出错了。错误已记录，供管理员查看。"
  # 每个命令都能识别的关键词（英文始终有效）。插件可以用 commands.<命令>.values.<关键词> 为自己的命令覆盖。
  # 若为列表：显示第一个名称，所有名称均可识别。
  values:
    "on": [开, 开启]
    "off": [关, 关闭]
    "true": 是
    "false": 否
    "yes": 是
    "no": 否
    clear: 清除
    list: 列表
    all: 全部
  overview:
    header: "<gold>── <yellow>命令</yellow> ── <gray>第 {page}/{pages} 页"
    plugin: "<aqua><bold>{plugin}"
    line: "<yellow>/{command}</yellow>{also}<dark_gray> – <gray>{description}"
    also: "<dark_gray> (/{aliases})"
    hover: "<gray>{description}\n<yellow>点击：{action}"
    action-help: "显示帮助"
    action-type: "输入命令"
    empty: "<gray>没有你可以使用的命令。"
    unknown-plugin: "<red>没有名为 {plugin} 的带命令插件。"
    footer: "<dark_gray>点击一个命令。只看一个插件：/vhelp PLUGIN"
  admin:
    header: "<gold>── <yellow>已注册的命令</yellow> ── <gray>{count} 个命令树，第 {page}/{pages} 页"
    mode: "<gray>本地化主命令别名：<white>{mode}</white> <dark_gray>（服务器语言：{language}）"
    mode-option: "<yellow>[{mode}]"
    mode-hover: "点击：使用 {mode}"
    line: "<aqua>{plugin}</aqua> <yellow>/{command}</yellow> <dark_gray>({mount})</dark_gray><gray>{fixed}"
    fixed: " · 别名：{aliases}"
    label-conflict: "<red>  /{command} 已被 {owner} 占用；只能使用 /{prefix}:{command}。"
    fixed-conflict: "<red>  固定别名 /{alias} 已被 {owner} 占用；它会执行那个命令，而不是这个。"
    alias: "<gray>  {language}: <white>/{alias}</white> {state}"
    state-active: "<green>已启用"
    state-off_by_policy: "<dark_gray>关闭（语言未启用）"
    state-disabled: "<red>已关闭"
    state-collision: "<gold>已跳过，被 {owner} 占用"
    state-pending: "<gray>启动完成后生效"
    turn-off: "<red>[关闭]"
    turn-on: "<green>[开启]"
    toggle-hover: "点击：/vadmin commands alias {alias} {value}"
    conflict: "<gold>  名称冲突 {conflict}"
    other: "<gray>尚未迁移（仅 plugin.yml）：<white>{commands}"
