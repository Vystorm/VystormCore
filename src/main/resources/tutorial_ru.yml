title: Vystorm Core
permission: ''
pages:
- title: Начинать надо с /vmenu
  text: |
    1. Тип /vmenu в чате.
    2. Выберите "Туториалы"".
    3. Выбрать "<plugin name> · «Путеводитель», а затем тема.
    4. "Все «учебники» возвращают вас в список плагинов; оттуда «Назад к» /vmenu" ведет к главному меню.

    Core объединяет использование Vystorm плагинов. Запасы, содержащие реальные предметы, остаются запасами; входы, подтверждения и руководства открываются в виде Minecraft диалогов.
- title: Главное меню и меню ESC
  text: |
    Есть три способа открыть главное меню Vystorm:
    1. /vmenu в чате.
    2. Пресса ESC Выберите меню "Vystorm"".
    3. Ключ быстрого действия (Minecraft ключ связывания "Быстрые действия")").

    Главное меню сортирует все плагины по областям: характер, экономика, сообщество, мир и приключения, строительство и технологии, учебные пособия и - для администраторов - администрирование. Область появляется только тогда, когда есть что-то, что вам разрешено открыть.
- title: Настройки
  text: |
    Главное меню → "Настройки" или /vsettings Открывает личные настройки всех плагинов. Измените значения и нажмите «Сохранить»; применяются только измененные значения.

    Здесь вы также можете выбрать свой язык («Язык»). «Автоматический» следует вашему языку Minecraft.

    Администраторы также видят «Настройки сервера»: конфигурацию плагинов. Изменения касаются всего сервера. /vsettings server открывает их непосредственно.
- title: Поиск гидов
  text: |
    1. Открыть /vmenu и выбрать "Туториалы"".
    2. Выбрать "<plugin name> · Руководство".
    3. Выберите тему. «Следующая» и «Назад» страница в руководстве; «Все темы» возвращаются к обзору.

    /vmenu Учебные пособия открывают категорию учебных пособий напрямую; прямые ключи, такие как: /vmenu Deep Inventory: учебник продолжает работать.

    /vmenu list показывает доступные ключи меню. Вы можете поставить ключ сразу после /vmenu, e.g. /vmenu Оригинальное название: Deepinventory:tutorial. Ключ Tab поможет вам выбрать.
- title: Использование диалогов
  text: |
    Вводы: заполните отмеченные поля и нажмите «Применить» или показанную кнопку действия.
    Подтверждения: прочитайте цель и расходы, прежде чем подтвердить. «Отмена» не приводит в действие.
    Кнопки только переворачивают страницы; они никогда ничего не покупают, не создают и не меняют.

    Диалоги истекают примерно через минуту. Откройте меню снова, если старый ответ больше не принимается. Разрешения, акции или цели, которые изменились за это время, также могут сделать действие недействительным.
- title: Когда что-то недоступно
  text: |
    Если вход отсутствует, проверьте /vmenu list first. A плагин может быть отключен или у вас может отсутствовать разрешение.

    Если действие отклонено, прочитайте сообщение в чате и соответствующее руководство: часто отсутствует пространство, баланс, полная настройка или доступ к цели.

    Если что-то изменилось с тех пор, как вы открыли вид, откройте его снова. Если ошибка остается, сообщите команде сервера плагин, ваши действия и точное сообщение.
