# Core-eigene Befehle (Schlüssel-Konvention für jedes Plugin, siehe docs/API.md "Commands"): Beschreibung, übersetzte
# Haupt-Aliase, Namen der Unterbefehle und Argumente.
commands:
  screen:
    description: "Bildschirme: offenen Bildschirm schließen; Admins: Demo"
    sub:
      settings:
        name: "einstellungen"
        args:
          resolution: "BREITExHÖHE"
        description: "Anzeige-Einstellungen für Bildschirme: Seitenverhältnis, Sichtfeld, Größe"
      classic:
        name: "klassisch"
        args:
          state: "an|aus"
        description: "Klassische Bildschirme an/aus (für Shaderpacks)"
      close:
        name: "schließen"
        description: "Deinen offenen Bildschirm schließen"
      demo:
        name: "demo"
        args:
          mode: "MODUS"
          backdrop: "HINTERGRUND"
        description: "Bildschirm-Demo öffnen (pinned oder floating)"
  vpoll:
    description: "Serverumfragen"
    sub:
      start:
        name: "starten"
        args:
          seconds: "SEKUNDEN"
          question: "FRAGE | ANTWORT | ANTWORT"
        description: "Umfrage starten: Sekunden Frage | Antwort | Antwort"
      vote:
        name: "abstimmen"
        args:
          id: "UMFRAGE-ID"
          option: "ANTWORT"
        description: "Über die anklickbaren Antworten in /vpoll abstimmen"
      close:
        name: "beenden"
        description: "Umfrage beenden und Ergebnis veröffentlichen"
      cancel:
        name: "abbrechen"
        description: "Ohne Ergebnis abbrechen"
      results:
        name: "ergebnis"
        description: "Letzte abgeschlossene Umfrage anzeigen"
  vnet:
    description: "Serverübergreifendes Netzwerk (Proxy-Hub)"
    sub:
      status:
        name: "status"
        description: "Verbindung zum Proxy-Hub"
      servers:
        name: "servers"
        description: "Server im Netzwerk mit Spielerzahl"
      broadcast:
        name: "broadcast"
        args:
          message: "NACHRICHT"
        description: "Ankündigung auf allen Servern (MiniMessage)"
      pair:
        name: "pair"
        description: "Diesen Server mit dem Proxy koppeln"
        sub:
          accept:
            name: "accept"
            args:
              code: "CODE"
            description: "Kopplung mit dem Code aus beiden Konsolen bestätigen"
      unpair:
        name: "unpair"
        description: "Kopplungsschlüssel vergessen"
  vhelp:
    description: "Alle Befehle, die du benutzen darfst, nach Plugin"
    aliases: [vhilfe, befehle]
    args:
      filter: PLUGIN
      page: SEITE
  menu:
    description: "Öffnet das Vystorm-Hauptmenü"
  vadmin:
    description: "Vystorm-Admin-Dashboard"
  admin:
    description: "Vystorm-Admin-Dashboard"
  einstellungen:
    description: "Persönliche und Server-Einstellungen aller Vystorm-Plugins"
  web:
    description: "Weboberfläche: öffnet eine Seite oder schickt einen Einmal-Login-Link"
  vtrade:
    description: "Handelskanal: Nachricht an alle mit Empfangsrecht"
