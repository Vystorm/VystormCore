# Vystorm loot categories: one entry point per loot situation, used by every Vystorm plugin.
# A plugin rolls e.g. category:boss_chest and passes its own list for that source as "self"
# (for example vystorm_dangerous_underground:boss/warden). By default a category only draws that own list,
# so each plugin keeps its own contents and odds. When a plugin has no own list (or is not installed),
# the "fallback: true" entries are used instead: the vanilla mixes from loot-vanilla.yml.
#
# Tune ALL plugins at once by editing a category here, for example:
#   - mix generic loot into every boss chest:   - {table: 'vystorm_core:vanilla/legendary', weight: 9500}
#     (each draw then picks the plugin list or this one by weight; raise rolls for extra draws)
#   - a bonus item everywhere:                  - {item: 'minecraft:diamond', weight: 9000}
#   - turn a category off: chance: 0
# Per source a plugin config can still point to another table or category (see the plugin's config).
# Preview: /vadmin loot simulate category:boss_chest 10000 self=<plugin table>
categories:
  dungeon_chest:
    entries:
      - {table: self, weight: 0}
      - {table: 'vystorm_core:default/dungeon_chest', weight: 0, fallback: true}
  boss_chest:
    entries:
      - {table: self, weight: 0}
      - {table: 'vystorm_core:default/boss_chest', weight: 0, fallback: true}
