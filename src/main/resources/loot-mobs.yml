# Vystorm Core mob loot: one own table per vanilla mob type, standard Minecraft items only.
# Rule for every Vystorm plugin: WHAT drops is defined by the mob (this table for vanilla mobs, the plugin's own
# table for custom mobs), HOW GOOD only by the mob's level (config.yml loot.mob-level-luck). Player luck does not count.
#
# These are BONUS drops on top of the normal vanilla drops. They are rolled by the plugin that owns the kill
# (SpawnDirector for vanilla/director mobs) through category:mob_drop_common / _elite / _boss with the table as "self".
# Mob types without a table here use vystorm_core:mob/default.
#
# mode: each = every entry is checked once per kill with its own chance (like vanilla drop lists).
# weight = rarity 0..10000 (tier: common <4000, uncommon <7000, rare <9000, epic <9800, legendary).
# The mob level raises the chance of rarer entries: luck 3 (level 60+) makes a weight-9500 entry about 1.7x likelier,
# a weight-1000 entry only 1.06x. table: '<id>' draws one item from that list (vystorm_core:vanilla/... in loot-vanilla.yml).
# Preview: /vadmin loot simulate vystorm_core:mob/zombie 10000 level=40
tables:
  'vystorm_core:mob/default':
    mode: each
    entries:
      - {table: 'vystorm_core:vanilla/common', weight: 1000, chance: 0.08}
      - {item: 'minecraft:iron_nugget', weight: 2500, chance: 0.06, min-amount: 1, max-amount: 3}
      - {table: 'vystorm_core:vanilla/uncommon', weight: 6000, chance: 0.03}
      - {table: 'vystorm_core:vanilla/rare', weight: 8500, chance: 0.006}
      - {table: 'vystorm_core:vanilla/epic', weight: 9600, chance: 0.001}

