# Vystorm Core – English texts.
# Format: MiniMessage (<red>, <bold>, <#ff8800>, <gray>…); legacy &c codes work too. {name} are placeholders.
# Keys missing here fall back to the text bundled in the jar (same language, then English), so new keys from a
# Core update work without editing this file. Delete the file to get a fresh copy. Add a language: copy this file to
# lang/<code>.yml (e.g. fr.yml) and translate it; "/vadmin language reload" applies changes.
