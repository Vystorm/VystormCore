# Core's own commands (key convention for every plugin, see docs/API.md "Commands"): description, localized root
# aliases, subcommand names, argument names.
commands:
  screen:
    description: "Screens: close an open screen; admins: demo screen"
    sub:
      settings:
        name: "settings"
        args:
          resolution: "WIDTHxHEIGHT"
        description: "Display settings for screens: aspect ratio, field of view, size"
      classic:
        name: "classic"
        args:
          state: "on|off"
        description: "Classic screens on/off (for shader packs)"
      close:
        name: "close"
        description: "Close your open screen"
      demo:
        name: "demo"
        args:
          mode: "MODE"
          backdrop: "BACKDROP"
        description: "Open the screen demo (pinned or floating)"
  vpoll:
    description: "Server polls"
    sub:
      start:
        name: "start"
        args:
          seconds: "SECONDS"
          question: "QUESTION | ANSWER | ANSWER"
        description: "Start a poll: seconds question | answer | answer"
      vote:
        name: "vote"
        args:
          id: "POLL-ID"
          option: "ANSWER"
        description: "Vote using the clickable answers in /vpoll"
      close:
        name: "close"
        description: "Finish the poll and publish results"
      cancel:
        name: "cancel"
        description: "Cancel without publishing results"
      results:
        name: "results"
        description: "Show the last completed poll"
  vnet:
    description: "Cross-server network (proxy hub)"
    sub:
      status:
        name: "status"
        description: "Connection to the proxy hub"
      servers:
        name: "servers"
        description: "Servers in the network with player counts"
      broadcast:
        name: "broadcast"
