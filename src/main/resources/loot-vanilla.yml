# Vystorm Core basic loot: standard Minecraft items only (no plugin items), shared by every Vystorm plugin.
# Edit with /vadmin config vystorm_core (file loot-vanilla.yml) or here, then /vadmin loot reload.
# Preview: /vadmin loot show <id>, /vadmin loot roll <id>, /vadmin loot simulate <id> 10000
#
# weight = rarity 0..10000: 0 = commonest, 10000 = rarest. Selection tickets = 10001 - weight.
# Tiers by weight: common 0-3999, uncommon 4000-6999, rare 7000-8999, epic 9000-9799, legendary 9800-10000.
# amount / min-amount / max-amount: stack size per hit. rolls / min-rolls / max-rolls: draws per roll.
# enchant-levels: 'min-max' (1..30) enchants like an enchanting table; treasure-enchants: true allows mending etc.
# potion: potion type for potion, splash_potion, lingering_potion and tipped_arrow.
# Conditions (ignored when the roll does not know the value): min-y, max-y, environments [normal, nether, the_end],
# biomes [minecraft:lush_caves, ...], min-difficulty, max-difficulty (difficulty is set by the rolling plugin).
# table: '<id>' draws from another table. Add your own (or VystormItems) entries to any list.
#
# Layers: vanilla/<tier> and vanilla/<theme> are building blocks (1 draw each),
# default/<situation> mixes them for one situation (several draws), loot-categories.yml picks per situation.
